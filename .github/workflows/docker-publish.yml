name: Build and publish the API image

# The production instance has 911 MiB of RAM. `tsc` needs more heap than that
# to compile this project, so building on the box means 20 minutes of swap
# thrash per deploy and an abort if anything else is resident. A hosted runner
# has 7 GB and does it in a couple of minutes; the server then only needs the
# memory to RUN the API, not to compile it.

on:
  push:
    branches: [main]
    # Docs-only changes do not change the image.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GHCR with the automatic GITHUB_TOKEN — no PAT
      # needs to exist for the publishing half of this.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what the server pulls; the sha tag is what you roll
          # back to when `latest` turns out to be wrong.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache, so an unchanged dependency tree
          # is not reinstalled on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
