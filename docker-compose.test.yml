# Test database — used by `pnpm run test:integration`.
#
#   pnpm run db:up      start
#   pnpm run db:down    stop and destroy
#
# Port 5434 so it never collides with the native Postgres on 5432 or the
# development database on 5433.
#
# Storage is tmpfs: the data lives in RAM, which makes the truncate-between-tests
# cycle fast and guarantees nothing survives a restart.

services:
  test-db:
    image: postgres:16-alpine
    container_name: bjspades-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bjspades_test
      # Safe here precisely because the data is disposable.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bjspades_test']
      interval: 3s
      timeout: 3s
      retries: 20
